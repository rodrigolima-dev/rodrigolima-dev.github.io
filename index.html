<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1eb" />
    <script>
      ;(() => {
        let theme = 'light'
        let locale = 'en'
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          locale = localStorage.getItem('portfolio-locale') === 'pt-BR' ? 'pt-BR' : 'en'
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.lang = locale
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#111d1a' : '#f4f1eb'
      })()
    </script>
    <meta
      name="description"
      content="Rodrigo Lima builds web products and AI workflows. Explore public projects with code, tests, and engineering decisions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rodrigo Lima — Full Stack Software Engineer &amp; CTO" />
    <meta
      property="og:description"
      content="Web products, applied AI, and public projects with code and tests you can inspect."
    />
    <meta property="og:image" content="/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rodrigo Lima — Full Stack Software Engineer &amp; CTO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
