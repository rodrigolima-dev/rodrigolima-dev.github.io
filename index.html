    <script>
      try {
        const l = localStorage.getItem('portfolio-locale')
        if (l === 'pt-BR' || l === 'en') document.documentElement.lang = l
        const t = localStorage.getItem('portfolio-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
