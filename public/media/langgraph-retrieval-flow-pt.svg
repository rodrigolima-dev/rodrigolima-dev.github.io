<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Busca protegida</title><desc id="diagram-desc">Quatro etapas visuais resumem o grafo local: validação, autorização, busca no escopo com avaliação e resposta. Pedidos negados param e há uma nova tentativa determinística possível.</desc><style><![CDATA[
text{font-family:Segoe UI,Arial,sans-serif}
.kicker{font-size:15px;font-weight:750;letter-spacing:2.2px;fill:#b8553c}
.title{font-size:35px;font-weight:750;fill:#20362d}
.subtitle{font-size:19px;fill:#64766a}
.number{font-size:16px;font-weight:750;fill:#aa684f}
.step{font-size:31px;font-weight:700;fill:#233c2d}
.note{font-size:20px;font-weight:650;fill:#56735f}
.arrow-pulse{animation:soft-pulse 3.5s ease-in-out infinite}
.arrow-pulse.second{animation-delay:1.7s}
@keyframes soft-pulse{0%,70%,100%{opacity:.32}25%{opacity:1}}
@media (prefers-reduced-motion: reduce){.arrow-pulse{animation:none!important;opacity:.7}}
]]></style><rect width="1040" height="540" rx="22" fill="#f3f5ef"/><rect x="22" y="22" width="996" height="496" rx="16" fill="#fbfcf8" stroke="#d5e0d4" stroke-width="2"/><path d="M54 148 H986" stroke="#e0e8dc" stroke-width="2"/><text x="54" y="67" class="kicker">LANGGRAPH</text><text x="54" y="105" class="title">Busca protegida</text><text x="54" y="132" class="subtitle">Um grafo determinístico e local</text><rect x="54" y="197" width="185" height="155" rx="17" fill="#ffffff" stroke="#c6d8c8" stroke-width="2"/><text x="80" y="231" class="number">01</text><text x="80" y="270" class="step">Validar</text><rect x="303" y="197" width="185" height="155" rx="17" fill="#fff4ee" stroke="#cf8c72" stroke-width="2"/><text x="329" y="231" class="number">02</text><text x="329" y="270" class="step">Autorizar</text><rect x="552" y="197" width="185" height="155" rx="17" fill="#ffffff" stroke="#c6d8c8" stroke-width="2"/><text x="578" y="231" class="number">03</text><text x="578" y="270" class="step">Buscar</text><text x="578" y="304" class="step">e avaliar</text><rect x="801" y="197" width="185" height="155" rx="17" fill="#ffffff" stroke="#c6d8c8" stroke-width="2"/><text x="827" y="231" class="number">04</text><text x="827" y="270" class="step" style="font-size:29px">Responder</text><path d="M239 274 H303" stroke="#9bb5a0" stroke-width="2.5"/><path d="M292 266 L303 274 L292 282" fill="none" stroke="#739a78" stroke-width="2.5"/><circle class="arrow-pulse " cx="271.0" cy="274" r="5" fill="#bf7154"/><path d="M488 274 H552" stroke="#9bb5a0" stroke-width="2.5"/><path d="M541 266 L552 274 L541 282" fill="none" stroke="#739a78" stroke-width="2.5"/><circle class="arrow-pulse second" cx="520.0" cy="274" r="5" fill="#bf7154"/><path d="M737 274 H801" stroke="#9bb5a0" stroke-width="2.5"/><path d="M790 266 L801 274 L790 282" fill="none" stroke="#739a78" stroke-width="2.5"/><circle class="arrow-pulse " cx="769.0" cy="274" r="5" fill="#bf7154"/><rect x="303" y="381" width="185" height="43" rx="9" fill="#f5e9e2"/><text x="318" y="408" class="note" style="fill:#a2634c">Negado → parar</text><rect x="552" y="381" width="320" height="43" rx="9" fill="#e9efe6"/><text x="568" y="408" class="note">Uma nova busca no escopo</text><path d="M54 454 H986" stroke="#e0e8dc"/><text x="54" y="483" class="subtitle" style="font-size:15px">Empresas fictícias · sem chamada ao modelo</text></svg>