<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Automation rules</title><desc id="diagram-desc">A simple conceptual flow for the four public offline n8n examples: manually provide a synthetic input, apply an explicit rule, and return an accepted or review outcome.</desc><style><![CDATA[
text{font-family:Segoe UI,Arial,sans-serif}
.kicker{font-size:15px;font-weight:750;letter-spacing:2.2px;fill:#b8553c}
.title{font-size:35px;font-weight:750;fill:#20362d}
.subtitle{font-size:19px;fill:#64766a}
.number{font-size:16px;font-weight:750;fill:#aa684f}
.step{font-size:31px;font-weight:700;fill:#233c2d}
.note{font-size:20px;font-weight:650;fill:#56735f}
.arrow-pulse{animation:soft-pulse 3.5s ease-in-out infinite}
.arrow-pulse.second{animation-delay:1.7s}
@keyframes soft-pulse{0%,70%,100%{opacity:.32}25%{opacity:1}}
@media (prefers-reduced-motion: reduce){.arrow-pulse{animation:none!important;opacity:.7}}
]]></style><rect width="1040" height="540" rx="22" fill="#f3f5ef"/><rect x="22" y="22" width="996" height="496" rx="16" fill="#fbfcf8" stroke="#d5e0d4" stroke-width="2"/><path d="M54 148 H986" stroke="#e0e8dc" stroke-width="2"/><text x="54" y="67" class="kicker">N8N</text><text x="54" y="105" class="title">Automation rules</text><text x="54" y="132" class="subtitle">Four inactive, offline workflows</text><rect x="68" y="197" width="240" height="155" rx="17" fill="#ffffff" stroke="#c6d8c8" stroke-width="2"/><text x="94" y="231" class="number">01</text><text x="94" y="270" class="step">Manual</text><text x="94" y="304" class="step">input</text><rect x="400" y="197" width="240" height="155" rx="17" fill="#fff4ee" stroke="#cf8c72" stroke-width="2"/><text x="426" y="231" class="number">02</text><text x="426" y="270" class="step">Explicit</text><text x="426" y="304" class="step">rule</text><rect x="732" y="197" width="240" height="155" rx="17" fill="#ffffff" stroke="#c6d8c8" stroke-width="2"/><text x="758" y="231" class="number">03</text><text x="758" y="270" class="step">Accept /</text><text x="758" y="304" class="step">review</text><path d="M308 274 H400" stroke="#9bb5a0" stroke-width="2.5"/><path d="M389 266 L400 274 L389 282" fill="none" stroke="#739a78" stroke-width="2.5"/><circle class="arrow-pulse " cx="354.0" cy="274" r="5" fill="#bf7154"/><path d="M640 274 H732" stroke="#9bb5a0" stroke-width="2.5"/><path d="M721 266 L732 274 L721 282" fill="none" stroke="#739a78" stroke-width="2.5"/><circle class="arrow-pulse second" cx="686.0" cy="274" r="5" fill="#bf7154"/><path d="M54 424 H986" stroke="#e0e8dc"/><text x="54" y="462" class="subtitle" style="font-size:17px">Synthetic samples · no Agent or network calls</text></svg>