.eyebrow{font-size:23px;letter-spacing:3px;font-weight:750;fill:#bb5e43}
.heading{font-size:53px;font-weight:750;fill:#18392b}
.subtitle{font-size:27px;fill:#64766c}
.badge{font-size:22px;font-weight:750;fill:#8a442e}
.num{font-size:22px;font-weight:800;fill:#ba6b50}
