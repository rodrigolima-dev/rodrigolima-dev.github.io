<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="concept-title concept-desc"><title id="concept-title">Conceptual V2 operations journey</title><desc id="concept-desc">Illustrative journey across conversation, context, and human handoff. Generic synthetic shapes only; not a screenshot of the private application.</desc><defs><radialGradient id="backdrop" cx="74%" cy="36%" r="75%"><stop offset="0" stop-color="#3a5a47"/><stop offset="1" stop-color="#18362b"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#071d14" flood-opacity=".25"/></filter></defs><style><![CDATA[
